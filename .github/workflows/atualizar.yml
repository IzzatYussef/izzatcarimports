# Atualiza o catalogo do site sozinho, na nuvem do GitHub (nao depende do PC).
# Puxa so os anuncios ATIVOS do ML pelo backend (Cloudflare), regera o indice e
# as paginas /peca/ (apagando as de pecas vendidas/pausadas) e publica.
name: Atualizar catalogo

on:
  schedule:
    - cron: "*/30 * * * *"   # a cada 30 min
  repository_dispatch:
    types: [venda_ml]        # gatilho imediato (backend pode chamar ao vender)
  workflow_dispatch:         # botao manual no GitHub

concurrency:
  group: atualizar-catalogo
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests python-dotenv
      - name: Puxar anuncios ativos e regerar paginas
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python -u atualizar_catalogo.py
          python -u gerar_indice.py
          python -u gerar_paginas_individuais.py
      - name: Publicar se mudou
        run: |
          git config user.name "izzat-bot"
          git config user.email "izzat-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada mudou"; exit 0; fi
          git commit -m "Catalogo atualizado automaticamente"
          git push
